<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion Dépenses</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>💸 Gestion des Dépenses</h1>

    <h2>Total Dépenses</h2>
    <p style="font-size: 22px; font-weight: bold;">
        <span id="totalExpenses">0</span> €
    </p>

    <hr>
<h2>✅ Rembourser une dépense</h2>

<input
    type="number"
    id="reimburseExpenseId"
    placeholder="ID de la dépense"
/>

<button onclick="reimburseExpense()">
    Rembourser
</button>

<p id="reimburseExpenseMessage"></p>

<hr>
<h2>🗑️ Supprimer une dépense</h2>

<input
    type="number"
    id="deleteExpenseId"
    placeholder="ID de la dépense"
/>

<button onclick="deleteExpense()">
    Supprimer
</button>

<p id="deleteExpenseMessage"></p>

<hr>

    <div id="expensesList"></div>

    <br>

    <a href="admin.html">
        <button>⬅ Retour Admin</button>
    </a>
</div>

<script src="app.js"></script>

</body>
</html>
